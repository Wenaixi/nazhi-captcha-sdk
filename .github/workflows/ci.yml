name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: 全量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: 代码格式检查
        run: test -z "$(gofmt -l .)"
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试（含竞态检测）
        run: go test -race -count=1 ./...
      - name: 编译全部工具
        run: go build ./... && go build -o /dev/null ./cmd/...
