name: ci

on:
  push:
    branches: [master]
    tags:
      - "v*"

jobs:
  test:
    name: 全量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - name: 代码格式检查
        run: gofmt -l .
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试（含竞态检测）
        run: go test -race -count=1 ./...
      - name: 编译全部工具
        run: go build ./... && go build -o /dev/null ./cmd/...

  release:
    name: 发布产物
    if: startsWith(github.ref, "refs/tags/v")
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: 构建
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/tools
          go build -ldflags="-s -w" -o dist/tools/demo${{ matrix.ext }} ./cmd/demo
          cp data/builtin.bin dist/
          cp README.md LICENSE dist/
      - name: 打包
        run: |
          cd dist
          tar -czf ../nazhi-captcha-sdk-${{ matrix.os }}-${{ matrix.arch }}.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}-${{ matrix.arch }}
          path: nazhi-captcha-sdk-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
