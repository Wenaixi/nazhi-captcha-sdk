name: release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: 全量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - name: 代码格式检查
        run: gofmt -l .
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试（含竞态检测）
        run: go test -race -count=1 ./...
      - name: 编译全部工具
        run: go build ./... && go build -o /dev/null ./cmd/...

  release:
    name: 构建发布产物
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: 构建全部工具
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/tools
          for c in demo stress train merge count hitrate gen; do
            go build -ldflags="-s -w" -o dist/tools/${c}${{ matrix.ext }} ./cmd/${c}
          done
          cp data/builtin.bin dist/
          cp README.md LICENSE dist/
      - name: 打包
        run: |
          cd dist
          tar -czf ../nazhi-captcha-sdk-${{ matrix.os }}-${{ matrix.arch }}.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: nazhi-captcha-sdk-${{ matrix.os }}-${{ matrix.arch }}
          path: nazhi-captcha-sdk-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  publish:
    name: 发布到 GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nazhi-captcha-sdk-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
